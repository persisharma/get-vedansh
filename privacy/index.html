<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vedansh has moved to vedansh.app</title>
<!-- GitHub Pages cannot send a 301, so this page does the next best thing:
     a canonical to the new address, noindex, and an immediate refresh. Old
     store listings and shared links still arrive here, so the repo stays. -->
<link rel="canonical" href="https://vedansh.app/privacy/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://vedansh.app/privacy/">
<script>location.replace("https://vedansh.app/privacy/");</script>
</head>
<body>
<p>Vedansh now lives at <a href="https://vedansh.app/privacy/">https://vedansh.app/privacy/</a>.</p>
</body>
</html>
